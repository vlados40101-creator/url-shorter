<!DOCTYPE html>
<html lang="ru">
    
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>URL Shortener</title>
        <meta name="description" content="Home page for url shortener">
        <link rel="stylesheet" href="/static/global.css" type="text/css" />
    </head>
    <body>
        <main>
            <h1>✨ URL Shortener</h1>
            <p>Сокращайте длинные ссылки и делитесь ими легко! Просто вставьте URL в поле ниже.</p>
            
            <!-- Форма для создания новой ссылки -->
            <section id="createLinkSection">
                <h2>🔗 Создать короткую ссылку</h2>
                <form id="createLinkForm">
                    <div class="form-group">
                        <label for="urlInput">Введите URL:</label>
                        <input type="url" id="urlInput" placeholder="https://example.com" required>
                    </div>
                    <button type="submit" class="action create">Сократить</button>
                </form>
            </section>
            
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
                <h2 style="margin: 0;">📋 Все ссылки</h2>
                <button id="refreshButton">🔄 Обновить</button>
            </div>
            
            <table id="linksTable">
                <caption>
                    Все сокращенные ссылки
                </caption>
                <thead>
                    <tr>
                        <th scope="col">Код</th>
                        <th scope="col">Ссылка</th>
                        <th scope="col" style="text-align: center;">Действие</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Ссылки будут загружены сюда автоматически -->
                </tbody>
            </table>
        </main>
        <script src="/static/logic.js" defer></script>
    </body>
</html>
